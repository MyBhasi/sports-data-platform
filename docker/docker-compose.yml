version: "3.9"

services:
  postgres:
    image: postgres:15
    env_file: services/postgres/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    env_file: services/kafka/.env

  cassandra:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    env_file: services/cassandra/.env
    volumes:
      - cassandra_data:/var/lib/cassandra

  app:
    build: ..
    depends_on:
      - postgres
      - kafka
      - cassandra
    env_file: ../.env
    volumes:
      - ../data:/app/data

volumes:
  postgres_data:
  cassandra_data:
